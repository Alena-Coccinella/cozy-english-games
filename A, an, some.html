<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pastel Pop | a • an • some</title><style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#322447}*{box-sizing:border-box}html,body{margin:0;min-height:100%;}body{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:clamp(12px,3vmin,24px);background:radial-gradient(circle at 15% 18%,#f9d4e8 0,transparent 28%),radial-gradient(circle at 86% 82%,#c8e9e1 0,transparent 32%),linear-gradient(135deg,#eee4fb,#e8dff6 65%,#f8e5ee)}.shell{width:min(100%,620px);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;color:#74599c;font-size:clamp(11px,2.6vw,13px);font-weight:800;letter-spacing:1.2px;margin-bottom:10px}.progress{height:7px;background:#ffffffa6;border-radius:99px;overflow:hidden;margin-bottom:16px}.bar{height:100%;width:0;background:linear-gradient(90deg,#a788db,#e6a3cc);transition:width .35s}.panel{background:#fffdfefa;border:1px solid white;border-radius:24px;padding:clamp(18px,4vw,30px);box-shadow:0 14px 42px #79649d29;text-align:center}.pill{display:inline-block;background:#f9e5f1;color:#9c5989;border-radius:99px;padding:7px 17px;font-weight:800;font-size:clamp(12px,2.8vw,14px);letter-spacing:.3px}.question{font-size:clamp(21px,4.5vw,30px);line-height:1.5;font-weight:750;margin:25px auto 30px;max-width:540px;min-height:0;display:block;text-align:center;overflow-wrap:normal;word-break:normal}.blank{display:inline-block;color:#9871ce;border-bottom:3px solid #cbb0e7;padding:0 5px;white-space:nowrap;vertical-align:baseline;line-height:1.2;min-width:48px}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.choice{font-family:inherit;font-size:clamp(19px,4vw,23px);font-weight:800;border:2px solid #e8d9f4;background:#f9f5ff;color:#6e4b9d;border-radius:15px;padding:13px 5px;min-width:0;cursor:pointer;transition:transform .15s,background .15s}.choice:hover:not(:disabled){background:#eee3fa}.choice:focus-visible,.next:focus-visible{outline:3px solid #8360b8;outline-offset:3px}.choice:disabled{cursor:default}.choice.correct{background:#dcf4e7;border-color:#75c7a1;color:#257b57}.choice.wrong{background:#ffe5ec;border-color:#e9a3b5;color:#b24e73}.feedback{min-height:24px;margin-top:15px;font-size:15px;font-weight:750;color:#9d5b82}.feedback.good{color:#328764}.next{background:#8e6ac7;border:0;color:white;border-radius:14px;padding:12px 27px;font:800 16px system-ui;cursor:pointer;margin-top:8px;box-shadow:0 6px 14px #9b7bc644}.next:hover{background:#7954b5}.hidden{display:none!important}.dots{display:flex;justify-content:center;gap:8px;margin-top:16px}.dots span{width:8px;height:8px;border-radius:50%;background:#c4a3e8}.dots span:nth-child(2){background:#efaacb}.dots span:nth-child(3){background:#a6d9ce}.dots span:nth-child(4){background:#f0d48e}.dots span:nth-child(5){background:#b9b4ec}.score{font-size:clamp(44px,10vw,62px);font-weight:900;color:#8760bc;margin:12px 0 4px}.note{color:#756b80;line-height:1.5;font-size:14px}#finish h1{font-size:clamp(27px,6vw,38px);margin:20px 0 8px}
@media(max-width:380px){.panel{padding:18px 14px}.question{font-size:21px;margin:23px auto 26px}.choices{gap:7px}.choice{padding:12px 3px}}
@media(orientation:landscape) and (max-height:650px){body{padding:8px 14px;align-items:flex-start}.shell{width:min(100%,720px)}.top{font-size:11px;margin-bottom:5px}.progress{height:5px;margin-bottom:9px}.panel{border-radius:19px;padding:12px 24px}.pill{font-size:11px;padding:4px 14px}.question{font-size:clamp(19px,3.4vw,26px);line-height:1.35;margin:12px auto 16px}.blank{border-bottom-width:2px}.choices{gap:10px}.choice{font-size:19px;padding:8px 4px;border-radius:12px}.feedback{font-size:13px;min-height:19px;margin-top:9px}.next{font-size:14px;padding:8px 23px;margin-top:5px}.dots{margin-top:9px}.dots span{width:6px;height:6px}#finish h1{font-size:26px;margin:8px 0 2px}.score{font-size:40px;margin:3px}.note{margin:4px;font-size:12px}}
@media(orientation:landscape) and (max-height:370px){.panel{padding:8px 20px}.question{margin:7px auto 10px;font-size:19px}.choice{padding:6px 4px}.feedback{margin-top:5px}.next{padding:6px 20px}.dots{display:none}}
</style></head><body><main class="shell"><header class="top"><span>ENGLISH PRACTICE</span><span id="counter">01 / 10</span></header><div class="progress"><div class="bar" id="bar"></div></div><section class="panel" id="game"><div class="pill">a • an • some</div><div class="question" id="question" aria-live="polite"></div><div class="choices" id="choices"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="next hidden" id="next">Next →</button></section><section class="panel hidden" id="finish"><div class="pill">HOMEWORK COMPLETE ✦</div><h1>Great job!</h1><div class="score" id="score"></div><p class="note" id="summary"></p><button class="next" id="again">Play again ↻</button></section><div class="dots"><span></span><span></span><span></span><span></span><span></span></div></main><script>
const questions=[
{before:'I have got',after:'carrot.',answers:['a']},
{before:'She wants',after:'chocolate.',answers:['some']},
{before:'We have got',after:'sausages.',answers:['some']},
{before:'There is',after:'egg on the table.',answers:['an']},
{before:'I would like',after:'popcorn.',answers:['some']},
{before:'He eats',after:'biscuit after lunch.',answers:['a']},
{before:'They have got',after:'tomatoes.',answers:['some']},
{before:'Mum buys',after:'hot dog.',answers:['a']},
{before:'I can see',after:'rice in the bowl.',answers:['some']},
{before:'She has',after:'cucumber.',answers:['a']}
];
let index=0,firstTry=0,mistakes=0,attempted=false,done=false;
const $=id=>document.getElementById(id);
function render(){let q=questions[index];attempted=false;done=false;$('counter').textContent=String(index+1).padStart(2,'0')+' / 10';$('bar').style.width=(index/questions.length*100)+'%';$('question').replaceChildren(document.createTextNode(q.before+' '));let blank=document.createElement('span');blank.className='blank';blank.textContent='___';$('question').append(blank,document.createTextNode(' '+q.after));$('choices').replaceChildren();let options=['a','an','some']; // rotate answer positions across questions
const shifts=[0,2,1,0,2,1,0,2,1,0];options=options.slice(shifts[index]).concat(options.slice(0,shifts[index]));
for(const opt of options){let b=document.createElement('button');b.className='choice';b.textContent=opt;b.onclick=()=>choose(opt,b);$('choices').append(b)}$('feedback').textContent='';$('feedback').className='feedback';$('next').classList.add('hidden')}
function choose(opt,button){if(done)return;let ok=questions[index].answers.includes(opt);if(ok){if(!attempted)firstTry++;done=true;button.classList.add('correct');$('question').querySelector('.blank').textContent=opt;$('feedback').textContent='✓ Correct!';$('feedback').className='feedback good';[...$('choices').children].forEach(b=>b.disabled=true);$('next').classList.remove('hidden');$('next').textContent=index===questions.length-1?'See results →':'Next →'}else{if(!attempted)mistakes++;attempted=true;button.classList.add('wrong');button.disabled=true;$('feedback').textContent='Not quite — try again!';$('feedback').className='feedback'}}
$('next').onclick=()=>{if(index<questions.length-1){index++;render()}else{ $('bar').style.width='100%';$('counter').textContent='10 / 10';$('game').classList.add('hidden');$('finish').classList.remove('hidden');$('score').textContent=firstTry+' / 10';$('summary').textContent='Correct on the first try. '+(firstTry===10?'Perfect score! ✨':'You completed all 10 sentences!')}};
$('again').onclick=()=>{index=0;firstTry=0;mistakes=0;$('finish').classList.add('hidden');$('game').classList.remove('hidden');render()};render();
</script></body></html>
